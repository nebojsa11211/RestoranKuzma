name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurantsuite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test tests/RestaurantSuite.Tests.Unit/RestaurantSuite.Tests.Unit.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=unit-tests.trx"

    - name: Run integration tests
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=restaurantsuite_test;Username=postgres;Password=postgres"
        Redis__Configuration: "localhost:6379"
      run: dotnet test tests/RestaurantSuite.Tests.Integration/RestaurantSuite.Tests.Integration.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=integration-tests.trx"

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: .NET Tests
        path: '**/*.trx'
        reporter: dotnet-trx

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -f src/RestaurantSuite.Api/Dockerfile -t restaurantsuite-api:latest .

    - name: Test Docker image
      run: |
        docker run -d --name test-api -p 8080:8080 restaurantsuite-api:latest
        sleep 10
        docker stop test-api
        docker rm test-api
